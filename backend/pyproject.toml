[project]
name = "saqient-backend"
version = "0.1.0"
description = "Saqient Compliance Workspace API and worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy>=2.0.36,<2.2",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.4,<6",
  "redis>=5,<7",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.18",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
  "jinja2>=3.1.4,<4",
  "httpx>=0.27,<1",
  "google-re2>=1.1,<2",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35,<2"]
gcs = ["google-cloud-storage>=2.18,<4"]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<3",
  "types-reportlab",
  "pip-audit>=2.7,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "UP042", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"app/seed.py" = ["S105", "S106", "S311"]
"app/services/reports.py" = ["E501"]
"app/demo_content.py" = ["E501"]
"tests/**/*.py" = ["E501", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.13"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
