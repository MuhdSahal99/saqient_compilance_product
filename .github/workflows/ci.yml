name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PNPM_VERSION: "10.28.0"

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saqient
          POSTGRES_PASSWORD: saqient
          POSTGRES_DB: saqient_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saqient" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://saqient:saqient@localhost:5432/saqient_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      # Tesseract lets the OCR tests run end to end (they skip without it).
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
        working-directory: .
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: uv run pytest -q
      - name: Dependency audit
        run: uv export --frozen --no-dev --no-hashes -o requirements.txt && uvx pip-audit -r requirements.txt --strict

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saqient
          POSTGRES_PASSWORD: saqient
          POSTGRES_DB: saqient
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saqient" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: development
      DEMO_MODE: "true"
      CELERY_TASK_ALWAYS_EAGER: "false"
      STORAGE_LOCAL_PATH: ${{ github.workspace }}/backend/storage
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Start backend and worker
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m app.seed --reset
          nohup uv run uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          nohup uv run celery -A app.worker.celery_app worker -l info -c 2 > ../worker.log 2>&1 &
      - name: Build and serve frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm build
          nohup pnpm exec vite preview --port 4173 --strictPort > ../web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:4173/api/health/ready && break; sleep 1; done
      - name: Playwright
        working-directory: frontend
        run: pnpm e2e
      - name: Logs on failure
        if: failure()
        run: tail -n 200 api.log worker.log web.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config -q
      - run: docker compose build
