# Local development / single-host demo stack. Not hardened for production as-is:
# see docs/DEPLOYMENT.md. No external services, no telemetry.
name: saqient

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  DEMO_MODE: ${DEMO_MODE:-true}
  DATABASE_URL: postgresql+psycopg://saqient:${POSTGRES_PASSWORD:-saqient}@db:5432/saqient
  REDIS_URL: redis://redis:6379/0
  CELERY_TASK_ALWAYS_EAGER: "false"
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  STORAGE_BACKEND: local
  STORAGE_LOCAL_PATH: /data/storage
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
  # Links in emails point here. Mail goes to .eml files under the storage volume
  # unless MAIL_BACKEND=smtp (required in production) and the SMTP_* values are set.
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  MAIL_BACKEND: ${MAIL_BACKEND:-file}
  MAIL_FILE_DIR: /data/storage/mail
  MAIL_FROM: ${MAIL_FROM:-Saqient <no-reply@localhost>}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  # AI stays off unless set explicitly. See docs/MODEL_INTEGRATION.md before changing.
  AI_ENABLED: ${AI_ENABLED:-false}
  AI_PROVIDER: ${AI_PROVIDER:-disabled}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-}
  AI_ALLOW_INSECURE_HTTP: ${AI_ALLOW_INSECURE_HTTP:-false}
  AI_SERVING_INTERFACE_VERIFIED: ${AI_SERVING_INTERFACE_VERIFIED:-false}
  AI_AUTH: ${AI_AUTH:-api_key}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL_REASONING: ${AI_MODEL_REASONING:-}
  AI_MODEL_FAST: ${AI_MODEL_FAST:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  # OCR for scanned PDF pages: build with INSTALL_TESSERACT=true, then OCR_PROVIDER=tesseract.
  # Malware scanning: start the optional clamav service (--profile clamav) and set
  # MALWARE_SCAN=clamav. Uploads are refused while the scanner is unreachable.
  MALWARE_SCAN: ${MALWARE_SCAN:-disabled}
  CLAMAV_HOST: clamav
  OCR_PROVIDER: ${OCR_PROVIDER:-disabled}
  OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+ara}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saqient
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saqient}
      POSTGRES_DB: saqient
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saqient -d saqient"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: saqient-backend:local
    build:
      context: ./backend
      args:
        INSTALL_TESSERACT: ${INSTALL_TESSERACT:-false}
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: saqient-backend:local
    build:
      context: ./backend
      args:
        INSTALL_TESSERACT: ${INSTALL_TESSERACT:-false}
    environment: *backend-env
    volumes:
      - storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/ready').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: saqient-backend:local
    build:
      context: ./backend
      args:
        INSTALL_TESSERACT: ${INSTALL_TESSERACT:-false}
    environment: *backend-env
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info", "-c", "2"]
    volumes:
      - storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Celery beat: schedules the daily task due-date reminders (one instance only).
  beat:
    image: saqient-backend:local
    build:
      context: ./backend
      args:
        INSTALL_TESSERACT: ${INSTALL_TESSERACT:-false}
    environment: *backend-env
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: saqient-web:local
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }

  # Optional ClamAV daemon for upload scanning: `docker compose --profile clamav up -d`.
  # It downloads signature updates from the ClamAV mirrors on start. No port is published.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["clamav"]
    volumes:
      - clamav:/var/lib/clamav

  # Optional self-hosted model server (Jais or Falcon via vLLM). Never starts by
  # default: it needs `--profile ai`, an NVIDIA GPU host and INFERENCE_MODEL set to a
  # model whose licence you have checked. No port is published; only the api and
  # worker reach it on the compose network. Running it on a GPU machine costs money:
  # get approval first (docs/MODEL_INTEGRATION.md).
  inference:
    profiles: ["ai"]
    image: vllm/vllm-openai:v0.31.0
    command:
      - "--model=${INFERENCE_MODEL:-}"  # required: a licence-checked model id
      - "--served-model-name=${AI_MODEL:-local-model}"
      - "--max-model-len=${INFERENCE_MAX_MODEL_LEN:-8192}"
      - "--host=0.0.0.0"
      - "--port=8000"
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - model-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  storage:
  model-cache:
  clamav:
